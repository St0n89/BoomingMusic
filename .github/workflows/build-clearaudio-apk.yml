name: Build ClearAudio+ debug APK

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Kein setup-android noetig: ubuntu-latest bringt das Android-SDK mit
      # (ANDROID_HOME gesetzt, Lizenzen akzeptiert). setup-android@v3 stirbt
      # am nicht mehr existierenden Paket 'tools'.

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleGithubDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BoomingMusic-clearaudio-debug
          path: app/build/outputs/apk/github/debug/*.apk
